# Volta local development config template
#
# Copy to config/conversionconfig.ini and customize (that file is gitignored):
#   Copy-Item config\defaults\conversionconfig.volta.template.ini config\conversionconfig.ini
#
# Used by: tools/compare.py (H2K vs EnergyPlus comparison workflow)
# Not used for: h2k-hpxml CLI (pass the .h2k path on the command line instead)

[paths]
# Single file OR folder of .h2k files
source_h2k_path = C:/path/to/your/test/file.h2k
# source_h2k_path = C:/path/to/folder/of/h2k/files

# OpenStudio-HPXML is auto-detected by os-setup — do not set hpxml_os_path here.
#
# MUST be relative to the OpenStudio-HPXML install and start with "workflow/"
# for tools/compare.py simulation to work.
dest_hpxml_path = workflow/translated_h2ks/

# Where compare.py writes systems_compare_data.json
dest_compare_data = output/comparisons/

[simulation]
# Same flags you used in the old repo, e.g.:
flags = --hourly ALL --debug
# flags = --add-component-loads --debug

[weather]
weather_library = historic
weather_vintage = CWEC2020

[translation]
# SOC (default) or ASHRAE140
mode = SOC

[nonh2k]
timestep = 60
operable_window_avail_days = 3

[logging]
log_level = INFO
log_to_file = true
log_file_path = output/logs/h2k_hpxml.log
